[package]
name = "bpc"
version = "0.0.1"
edition = "2024"
description = "A binary protocol workbench"
license = "MIT"

[dependencies]
crossterm = "0.29"
mlua = { version = "0.12", features = ["lua54", "vendored"] }
ratatui = "0.30"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[[bench]]
name = "bit_benchmarks"
harness = false
